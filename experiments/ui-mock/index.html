<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひとめぐり（仮）— 外枠のモック</title>
<link rel="stylesheet" href="node_modules/@fontsource/zen-kaku-gothic-new/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/zen-kaku-gothic-new/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/zen-kaku-gothic-new/700.css">
<style>
/* Tokens. Chrome follows landing-page-design (ADR-0002): spacing steps, Tailwind type scale,
   dark surfaces from its list, base curve. The picture is the only colourful thing on screen;
   the one accent is taken from the picture's horizon at the current moment. */
:root{
  --room:#181818; --panel:#1F1F1F; --control:#272727; --control-hover:#313131;
  --ink:#ECECEC; --ink-quiet:#9B9B9B; --focus:#FFFFFF;
  --accent:#dd6777;            /* horizon colour at the playhead (from the strip data) */
  --s25:2px; --s50:4px; --s75:8px; --s100:12px; --s200:16px; --s300:24px; --s400:32px; --s500:40px; --s600:48px;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --font:"Zen Kaku Gothic New",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--room);color:var(--ink);font-family:var(--font);font-size:16px;line-height:24px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:var(--s200);top:-48px;background:var(--control);padding:var(--s75) var(--s100);border-radius:8px}
.skip:focus{top:var(--s200)}

.top{display:flex;align-items:center;gap:var(--s300);padding:var(--s200) var(--s400)}
.name{font-weight:700;font-size:18px;line-height:28px;letter-spacing:.04em;margin:0}
.name small{font-weight:400;font-size:12px;line-height:16px;color:var(--ink-quiet);margin-left:var(--s75);letter-spacing:0}
.samples{display:flex;gap:var(--s75);margin-left:auto}
.thumb{width:48px;height:32px;border-radius:4px;border:0;padding:0;overflow:hidden;cursor:pointer;opacity:.62;
  transition:opacity 300ms var(--ease),transform 500ms var(--ease)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{opacity:1}
.thumb[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.open{background:var(--control);border:0;border-radius:8px;padding:var(--s75) var(--s100);font-size:14px;line-height:20px;font-weight:700;cursor:pointer;
  transition:background-color 300ms var(--ease)}
.open:hover{background:var(--control-hover)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s400);padding:0 var(--s400) var(--s400)}
.picture{margin:0}
.picture img{width:100%;display:block;border-radius:4px}

/* The colour script: the whole loop in one band, and the timeline itself. */
.script{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--s200);margin-top:var(--s300)}
.play{width:48px;height:48px;border-radius:9999px;border:0;background:var(--ink);color:var(--room);cursor:pointer;display:grid;place-items:center;
  transition:transform 500ms var(--ease)}
.play:active{transform:scale(.98)}
.play svg{width:20px;height:20px}
.strip{position:relative;height:40px;border-radius:8px;overflow:hidden;cursor:pointer}
.strip .band{height:50%}
.strip .upper{background:linear-gradient(90deg, #134c8a 0.00%, #174b88 1.59%, #1f4984 3.17%, #28467e 4.76%, #2f4377 6.35%, #354071 7.94%, #393e6c 9.52%, #3b3c69 11.11%, #3b3c68 12.70%, #393b65 14.29%, #353962 15.87%, #31385d 17.46%, #2d3659 19.05%, #2a3556 20.63%, #293555 22.22%, #283454 23.81%, #263252 25.40%, #24304f 26.98%, #222d4c 28.57%, #1f2b49 30.16%, #1d2946 31.75%, #1c2844 33.33%, #1c2743 34.92%, #1b2743 36.51%, #1b2743 38.10%, #1b2743 39.68%, #1b2843 41.27%, #1b2843 42.86%, #1b2843 44.44%, #1a2943 46.03%, #1a2943 47.62%, #1a2943 49.21%, #1a2943 50.79%, #192a43 52.38%, #192a43 53.97%, #192a43 55.56%, #192a43 57.14%, #1a2b44 58.73%, #1c2e47 60.32%, #1f314a 61.90%, #21334b 63.49%, #21344d 65.08%, #223850 66.67%, #233c55 68.25%, #24405a 69.84%, #24445d 71.43%, #25455e 73.02%, #284963 74.60%, #2f536d 76.19%, #39607b 77.78%, #456f8b 79.37%, #507d9a 80.95%, #5888a6 82.54%, #5d8eac 84.13%, #5d8ead 85.71%, #598aab 87.30%, #5284a8 88.89%, #497da4 90.48%, #40749f 92.06%, #366a9a 93.65%, #2c6195 95.24%, #235991 96.83%, #1b528d 98.41%, #154e8b 100.00%)}
.strip .lower{background:linear-gradient(90deg, #f27a2f 0.00%, #f17935 1.59%, #ee7742 3.17%, #eb7450 4.76%, #e7705e 6.35%, #e36c69 7.94%, #e06971 9.52%, #df6776 11.11%, #dd6777 12.70%, #d2677a 14.29%, #c0677f 15.87%, #ab6684 17.46%, #986488 19.05%, #8a638a 20.63%, #86628b 22.22%, #826189 23.81%, #7a5f85 25.40%, #705b80 26.98%, #645779 28.57%, #585373 30.16%, #4e506e 31.75%, #464d6b 33.33%, #444c6a 34.92%, #444d6a 36.51%, #444d6a 38.10%, #444d6b 39.68%, #444e6b 41.27%, #454f6c 42.86%, #45506c 44.44%, #45506d 46.03%, #45516e 47.62%, #45526e 49.21%, #45536f 50.79%, #45536f 52.38%, #455470 53.97%, #455470 55.56%, #455470 57.14%, #4f556e 58.73%, #705765 60.32%, #915659 61.90%, #a05453 63.49%, #a45852 65.08%, #ae604f 66.67%, #bb6b49 68.25%, #c87642 69.84%, #d17e3a 71.43%, #d58038 73.02%, #d4843f 74.60%, #d38d4d 76.19%, #d0985e 77.78%, #cda370 79.37%, #caae80 80.95%, #c6b68c 82.54%, #c5ba92 84.13%, #c5ba92 85.71%, #c8b78d 87.30%, #cdb286 88.89%, #d4ab7b 90.48%, #daa370 92.06%, #e19a63 93.65%, #e69155 95.24%, #eb8948 96.83%, #ef813c 98.41%, #f17c33 100.00%)}
.strip .head{position:absolute;top:0;bottom:0;left:12.5%;width:2px;background:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.when{min-width:7em;text-align:right;margin:0}
.when b{display:block;font-weight:700;color:var(--accent)}
.when span{font-size:14px;line-height:20px;color:var(--ink-quiet);font-variant-numeric:tabular-nums}

/* No card behind the controls: the room itself is the panel, so the picture stays the only object. */
.panel{display:flex;flex-direction:column;gap:var(--s500);align-self:start;padding-top:var(--s50)}
.panel h2{font-size:14px;line-height:20px;font-weight:700;margin:0 0 var(--s100);color:var(--ink-quiet)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s50);background:var(--control);border-radius:8px;padding:var(--s50)}
.presets button{border:0;background:none;border-radius:4px;padding:var(--s75) var(--s50);font-size:14px;line-height:20px;cursor:pointer;color:var(--ink-quiet);
  transition:background-color 300ms var(--ease),color 300ms var(--ease)}
.presets button[aria-pressed="true"]{background:var(--control-hover);color:var(--ink);font-weight:700}
.slider{display:grid;grid-template-columns:1fr auto;gap:var(--s50) var(--s100);margin-top:var(--s200);font-size:14px;line-height:20px}
.slider output{color:var(--ink-quiet);font-variant-numeric:tabular-nums}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--ink)}
.islands{display:flex;flex-direction:column;gap:var(--s75)}
/* One row per role: the role name, then its islands as swatches, largest first. */
.role-row{display:grid;grid-template-columns:40px 1fr;gap:var(--s75);align-items:start}
.role-row>span{font-size:12px;line-height:16px;padding-top:2px;color:var(--ink-quiet)} /* 12/16 step; 2px centres it on the 20px swatch row */
.role-row>div{display:flex;flex-wrap:wrap;gap:var(--s50)}
.swatch{width:28px;height:20px;border-radius:4px;border:0;padding:0;cursor:pointer;transition:box-shadow 300ms var(--ease)}
.swatch:hover{box-shadow:0 0 0 1px var(--ink-quiet)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--room),0 0 0 4px var(--ink)}
.actions{display:flex;flex-direction:column;gap:var(--s75)}
.primary{border:0;border-radius:8px;padding:var(--s75) var(--s100);background:var(--ink);color:var(--room);font-weight:700;cursor:pointer;
  transition:transform 500ms var(--ease)}
.primary:active{transform:scale(.98)}
.secondary{border:0;border-radius:8px;padding:var(--s75) var(--s100);background:var(--control);font-size:14px;line-height:20px;font-weight:700;cursor:pointer}
.note{font-size:12px;line-height:16px;color:var(--ink-quiet);margin:0;text-wrap:pretty}
.name small{text-wrap:balance}

@media (max-width:960px){
  .stage{grid-template-columns:1fr;padding:0 var(--s200) var(--s300)}
  .top{padding:var(--s200);flex-wrap:wrap}
  .samples{order:3;width:100%;margin-left:0;overflow-x:auto}
  /* On a phone the colour script gets the full width; play and the time sit beneath it. */
  .script{grid-template-columns:auto 1fr;grid-template-areas:"strip strip" "play when"}
  .strip{grid-area:strip}
  .play{grid-area:play}
  .when{grid-area:when}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#picture">絵へ移る</a>
<header class="top">
  <h1 class="name">ひとめぐり<small>絵の色が、1日をひとめぐりする</small></h1>
  <nav class="samples" aria-label="見本の絵">
    <button class="thumb" aria-pressed="true" aria-label="運河の街"><img src="../../assets/hero/raw/canal-town.png" alt=""></button>
    <button class="thumb" aria-pressed="false" aria-label="雪の村"><img src="../../assets/hero/raw/snow-village.png" alt=""></button>
    <button class="thumb" aria-pressed="false" aria-label="灯台の岬"><img src="../../assets/hero/raw/lighthouse-cape.png" alt=""></button>
    <button class="thumb" aria-pressed="false" aria-label="オアシス"><img src="../../assets/hero/raw/desert-oasis.png" alt=""></button>
    <button class="thumb" aria-pressed="false" aria-label="港町"><img src="../../assets/samples/raw/flat-dusk-harbor.png" alt=""></button>
  </nav>
  <button class="open">自分の絵を開く</button>
</header>
<main class="stage">
  <section aria-label="絵と時間">
    <figure class="picture" id="picture"><img src="canal-t3.png" alt="運河の街。残照の時刻で、空は桃色、提灯が灯り始めている"></figure>
    <div class="script">
      <button class="play" aria-label="再生"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg></button>
      <div class="strip" role="slider" tabindex="0" aria-label="1周の中の時刻" aria-valuemin="0" aria-valuemax="24" aria-valuenow="3" aria-valuetext="残照、3.0 秒">
        <div class="band upper"></div><div class="band lower"></div><div class="head"></div>
      </div>
      <p class="when"><b>残照</b><span>3.0 / 24 秒</span></p>
    </div>
  </section>
  <aside class="panel" aria-label="台本と書き出し">
    <div>
      <h2>台本</h2>
      <div class="presets" role="group" aria-label="台本の種類">
        <button aria-pressed="true">1日の光</button><button aria-pressed="false">長い夕暮れ</button><button aria-pressed="false">夜の灯り</button>
      </div>
      <label class="slider">長さ<output>24 秒</output><input type="range" min="12" max="48" value="24"></label>
      <label class="slider">夜の深さ<output>ふつう</output><input type="range" min="0" max="100" value="50"></label>
      <label class="slider">灯りの強さ<output>ふつう</output><input type="range" min="0" max="100" value="50"></label>
    </div>
    <div>
      <h2>色の島</h2>
      <div class="islands">
        <div class="role-row"><span>空</span><div><button class="swatch" style="background:#134c8a" aria-label="空、面積 36.6%"></button><button class="swatch" style="background:#f27a2f" aria-label="空、面積 8.2%"></button><button class="swatch" style="background:#4a5e85" aria-label="空、面積 3.6%"></button><button class="swatch" style="background:#c66c44" aria-label="空、面積 3.1%"></button><button class="swatch" style="background:#9e6b55" aria-label="空、面積 1.1%"></button></div></div>
        <div class="role-row"><span>灯り</span><div><button class="swatch" style="background:#ef5723" aria-label="灯り、面積 0.9%"></button><button class="swatch" style="background:#f9c469" aria-label="灯り、面積 0.5%"></button><button class="swatch" style="background:#9a512b" aria-label="灯り、面積 0.3%"></button></div></div>
        <div class="role-row"><span>影</span><div><button class="swatch" style="background:#04111f" aria-label="影、面積 22.6%"></button><button class="swatch" style="background:#052240" aria-label="影、面積 13.3%"></button><button class="swatch" style="background:#01030b" aria-label="影、面積 1.0%"></button><button class="swatch" style="background:#362523" aria-label="影、面積 0.6%"></button></div></div>
        <div class="role-row"><span>中間</span><div><button class="swatch" style="background:#223a5e" aria-label="中間、面積 4.5%"></button><button class="swatch" style="background:#746371" aria-label="中間、面積 2.9%"></button><button class="swatch" style="background:#604033" aria-label="中間、面積 0.5%"></button><button class="swatch" style="background:#b59887" aria-label="中間、面積 0.1%"></button></div></div>
      </div>
    </div>
    <div class="actions">
      <button class="primary">動画を書き出す</button>
      <button class="secondary">この瞬間を画像で保存</button>
      <p class="note">点滅の基準に通った動画だけを書き出します。画像は外へ送りません。</p>
    </div>
  </aside>
</main>
</body>
</html>
