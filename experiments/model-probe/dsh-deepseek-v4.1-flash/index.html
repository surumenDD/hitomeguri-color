<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Chromatic Field</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: #08080a; overflow: hidden; }
  #field { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #out {
    margin: 0; padding: 28px 32px; min-height: 100vh; box-sizing: border-box;
    background: #08080a; color: #e8e2d8; overflow: auto;
    font: 13px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
    white-space: pre-wrap;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="field" role="img" aria-label="A slowly drifting field of colour"></canvas>
<pre id="out" hidden></pre>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // 1. Colour science: sRGB <-> OKLab/OKLCH (R1) and chroma-only gamut fitting (R2)
  // ---------------------------------------------------------------------------

  const TAU = Math.PI * 2;
  const clamp = (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x);
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };

  const srgbToLinear = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  const linearToSrgb = (c) => (c <= 0.0031308 ? c * 12.92 : 1.055 * c ** (1 / 2.4) - 0.055);

  const parseHex = (hex) => {
    const v = parseInt(hex.slice(1), 16);
    return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
  };

  const toHex = (rgb) =>
    '#' + rgb.map((c) => Math.round(clamp(c, 0, 1) * 255).toString(16).padStart(2, '0')).join('');

  // Björn Ottosson's OKLab matrices.
  function srgbToOklab(input) {
    const [r, g, b] = typeof input === 'string' ? parseHex(input) : input;
    const R = srgbToLinear(r);
    const G = srgbToLinear(g);
    const B = srgbToLinear(b);
    const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * G + 0.0514459929 * B);
    const m = Math.cbrt(0.2119034982 * R + 0.6806995451 * G + 0.1073969566 * B);
    const s = Math.cbrt(0.0883024619 * R + 0.2817188376 * G + 0.6299787005 * B);
    return [
      0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s,
    ];
  }

  function oklabToLinearSrgb([L, a, b]) {
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    return [
      4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s,
    ];
  }

  const oklchToOklab = ([L, C, h]) => {
    const rad = (h * Math.PI) / 180;
    return [L, C * Math.cos(rad), C * Math.sin(rad)];
  };

  const GAMUT_EPS = 1e-6;
  const inGamut = (lin) => lin.every((c) => c >= -GAMUT_EPS && c <= 1 + GAMUT_EPS);

  // R2: a colour outside sRGB keeps its L and h; only C shrinks, found by
  // bisection. No channel clipping anywhere: that would shift hue and L.
  function fitChromaToGamut(L, C, h) {
    const rad = (h * Math.PI) / 180;
    const at = (c) => [L, c * Math.cos(rad), c * Math.sin(rad)];
    if (inGamut(oklabToLinearSrgb(at(C)))) return C;
    let lo = 0;
    let hi = C;
    for (let i = 0; i < 24; i++) {
      const mid = (lo + hi) / 2;
      if (inGamut(oklabToLinearSrgb(at(mid)))) lo = mid;
      else hi = mid;
    }
    return lo;
  }

  function oklchToSrgb([L, C, h]) {
    const lin = oklabToLinearSrgb(oklchToOklab([L, C, h]));
    return lin.map((c) => clamp(linearToSrgb(clamp(c, 0, 1)), 0, 1));
  }

  // ---------------------------------------------------------------------------
  // 2. Palette (R3)
  // ---------------------------------------------------------------------------

  // Split-complementary harmony: three hues form one family around the base
  // (h0 ± 26°), and the split pair (h0 + 180° ∓ 26°) supplies contrast.
  // Lightness is staggered 0.30 -> 0.88 so the field has real tonal depth
  // instead of reading as one flat pastel blend.
  function createPalette() {
    const h0 = Math.random() * 360;
    const specs = [
      { L: 0.86, C: 0.075, h: h0 + 154 },
      { L: 0.72, C: 0.155, h: h0 + 26 },
      { L: 0.56, C: 0.170, h: h0 - 26 },
      { L: 0.40, C: 0.120, h: h0 + 206 },
      { L: 0.30, C: 0.095, h: h0 },
    ];
    return specs.map(({ L, C, h }) => {
      const hue = ((h % 360) + 360) % 360;
      return [L, fitChromaToGamut(L, C, hue), hue];
    });
  }

  // ---------------------------------------------------------------------------
  // 3. Self test (R9)
  // ---------------------------------------------------------------------------

  function runSelfTest() {
    const round4 = (x) => Number(x.toFixed(4));
    const swatches = ['#ff0000', '#00ff00', '#0000ff', '#ffffff', '#808080'];
    const probes = [
      [0.7, 0.4, 150],
      [0.5, 0.05, 30],
    ];

    const srgbToOklabReport = {};
    for (const hex of swatches) {
      const [L, a, b] = srgbToOklab(hex);
      srgbToOklabReport[hex] = { L: round4(L), a: round4(a), b: round4(b) };
    }

    const mappedReport = {};
    for (const [L, C, h] of probes) {
      const fitted = fitChromaToGamut(L, C, h);
      mappedReport[`oklch(${L} ${C} ${h})`] = {
        hex: toHex(oklchToSrgb([L, fitted, h])),
        C: round4(fitted),
      };
    }

    const report = { srgbToOklab: srgbToOklabReport, oklchToSrgbMapped: mappedReport };
    const json = JSON.stringify(report, null, 2);

    const out = document.getElementById('out');
    out.hidden = false;
    out.textContent = json;
    document.getElementById('field').hidden = true;
    console.log(json);
    console.log(report);
  }

  if (new URLSearchParams(location.search).has('selftest')) {
    runSelfTest();
    return;
  }

  // ---------------------------------------------------------------------------
  // 4. Renderer: one full-screen triangle, all blending in OKLab on the GPU
  // ---------------------------------------------------------------------------

  const VERTEX_SHADER = `#version 300 es
void main() {
  vec2 corner = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(corner * 2.0 - 1.0, 0.0, 1.0);
}`;

  const FRAGMENT_SHADER = `#version 300 es
precision highp float;

uniform vec2  uRes;
uniform float uTime;      // autonomous seconds, frozen under reduced motion
uniform float uAspect;
uniform vec3  uPal[5];    // OKLab
uniform vec2  uCenter[5]; // aspect-corrected field space
uniform float uRadius[5];
uniform int   uInjCount;
uniform vec2  uInjPos[24];
uniform vec3  uInjLab[24];
uniform float uInjRad[24];
uniform float uInjWeight[24];

out vec4 fragColor;

const float INV_255 = 1.0 / 255.0;

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  return 0.62 * vnoise(p) + 0.38 * vnoise(p * 2.07 + 17.3);
}

vec3 oklabToLinear(vec3 lab) {
  float l = lab.x + 0.3963377774 * lab.y + 0.2158037573 * lab.z;
  float m = lab.x - 0.1055613458 * lab.y - 0.0638541728 * lab.z;
  float s = lab.x - 0.0894841775 * lab.y - 1.2914855480 * lab.z;
  l = l * l * l;
  m = m * m * m;
  s = s * s * s;
  return vec3(
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
   -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
   -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s);
}

bool insideSrgb(vec3 lin) {
  return all(greaterThanEqual(lin, vec3(-1e-5))) && all(lessThanEqual(lin, vec3(1.0 + 1e-5)));
}

// Same rule as R2 in JS: keep L and h, bisect C down to the sRGB boundary.
vec3 mapToGamut(vec3 lab) {
  vec3 lin = oklabToLinear(lab);
  if (insideSrgb(lin)) return lin;
  float C = length(lab.yz);
  vec2 dir = C > 1e-6 ? lab.yz / C : vec2(0.0);
  float lo = 0.0;
  float hi = C;
  for (int i = 0; i < 9; i++) {
    float mid = 0.5 * (lo + hi);
    if (insideSrgb(oklabToLinear(vec3(lab.x, dir * mid)))) lo = mid;
    else hi = mid;
  }
  return oklabToLinear(vec3(lab.x, dir * lo));
}

vec3 linearToSrgb(vec3 c) {
  vec3 curved = 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055;
  return mix(c * 12.92, curved, step(vec3(0.0031308), c));
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = vec2(uv.x * uAspect, uv.y);

  // Slow domain warp: the blob boundaries breathe instead of looking like
  // pasted radial gradients. The noise clock is far below 20 s per cycle.
  float clock = uTime * 0.018;
  vec2 q = p * 1.25;
  vec2 warp = vec2(
    fbm(q + vec2(0.0, clock)),
    fbm(q + vec2(5.2, 1.7) - vec2(clock, 0.0))
  ) - 0.5;
  vec2 warped = p + warp * 0.34;

  vec3 acc = vec3(0.0);
  float wsum = 0.0;
  for (int i = 0; i < 5; i++) {
    vec2 d = (warped - uCenter[i]) / uRadius[i];
    float w = 1.0 / (pow(dot(d, d), 1.25) + 0.02);
    acc += uPal[i] * w;
    wsum += w;
  }
  vec3 lab = acc / wsum;

  // Pointer injections blend in OKLab too, and fade back into the field (R5).
  for (int i = 0; i < 24; i++) {
    if (i >= uInjCount) break;
    vec2 dp = p - uInjPos[i];
    float r2 = uInjRad[i] * uInjRad[i];
    float a = uInjWeight[i] * exp(-0.5 * dot(dp, dp) / r2);
    lab = mix(lab, uInjLab[i], a);
  }

  vec3 rgb = clamp(linearToSrgb(clamp(mapToGamut(lab), 0.0, 1.0)), 0.0, 1.0);

  // Fine dither: these gradients are almost flat, so 8-bit output would band.
  rgb += (hash12(gl_FragCoord.xy + fract(uTime) * 137.0) - 0.5) * (1.6 * INV_255);

  fragColor = vec4(clamp(rgb, 0.0, 1.0), 1.0);
}`;

  const canvas = document.getElementById('field');
  const out = document.getElementById('out');

  const gl = canvas.getContext('webgl2', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    preserveDrawingBuffer: true,
    powerPreference: 'high-performance',
  });

  if (!gl) {
    out.hidden = false;
    out.textContent = 'WebGL2 is not available in this browser.';
    canvas.hidden = true;
    return;
  }

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader) || 'shader compile failed');
    }
    return shader;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX_SHADER));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT_SHADER));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) || 'program link failed');
  }
  gl.useProgram(program);

  const uniform = (name) => gl.getUniformLocation(program, name);
  const uRes = uniform('uRes');
  const uTime = uniform('uTime');
  const uAspect = uniform('uAspect');
  const uPal = uniform('uPal[0]');
  const uCenter = uniform('uCenter[0]');
  const uRadius = uniform('uRadius[0]');
  const uInjCount = uniform('uInjCount');
  const uInjPos = uniform('uInjPos[0]');
  const uInjLab = uniform('uInjLab[0]');
  const uInjRad = uniform('uInjRad[0]');
  const uInjWeight = uniform('uInjWeight[0]');

  // ---------------------------------------------------------------------------
  // 5. State
  // ---------------------------------------------------------------------------

  const MAX_INJECTIONS = 16;
  const INJECT_LIFE = 6.0; // seconds until an injected colour has fully settled

  // Fixed composition; only the hue family is random. Light sits high-left,
  // the deep anchor low-right, so every palette keeps a readable diagonal.
  const BLOB_LAYOUT = [
    { x: 0.18, y: 0.26, r: 0.72 },
    { x: 0.72, y: 0.22, r: 0.58 },
    { x: 0.48, y: 0.66, r: 0.66 },
    { x: 0.92, y: 0.74, r: 0.54 },
    { x: 0.10, y: 0.88, r: 0.58 },
  ];

  const paletteLab = createPalette().map(oklchToOklab);
  const fade = {
    from: paletteLab.map((c) => c.slice()),
    to: paletteLab.map((c) => c.slice()),
    start: -1,
  };

  const injections = [];
  const palData = new Float32Array(15);
  const centerData = new Float32Array(10);
  const radiusData = new Float32Array(5);
  const injPosData = new Float32Array(48);
  const injLabData = new Float32Array(72);
  const injRadData = new Float32Array(24);
  const injWData = new Float32Array(24);

  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduceMotion = motionQuery.matches;
  motionQuery.addEventListener('change', (event) => {
    reduceMotion = event.matches;
    dirty = true;
  });

  let renderScale = Math.min(window.devicePixelRatio || 1, 1.5);
  const maxScale = renderScale;
  let autoTime = 0;
  let dirty = true;
  let frameMs = 16.7;
  let holdFrames = 0;

  // ---------------------------------------------------------------------------
  // 6. Drawing
  // ---------------------------------------------------------------------------

  function resize() {
    const w = Math.max(1, Math.round(window.innerWidth * renderScale));
    const h = Math.max(1, Math.round(window.innerHeight * renderScale));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    dirty = true;
  }

  function updatePalette(nowMs) {
    if (fade.start < 0) return;
    const t = clamp((nowMs - fade.start) / 1100, 0, 1);
    const e = t * t * (3 - 2 * t);
    for (let i = 0; i < 5; i++) {
      for (let k = 0; k < 3; k++) {
        paletteLab[i][k] = fade.from[i][k] + (fade.to[i][k] - fade.from[i][k]) * e;
      }
    }
    if (t >= 1) {
      fade.from = fade.to.map((c) => c.slice());
      fade.start = -1;
    }
  }

  function draw(nowSec) {
    const aspect = canvas.width / canvas.height;

    for (let i = 0; i < 5; i++) palData.set(paletteLab[i], i * 3);

    // Every autonomous period is >= 37 s, comfortably slower than R4 asks.
    for (let i = 0; i < 5; i++) {
      const base = BLOB_LAYOUT[i];
      const phase = i * 1.618;
      centerData[i * 2] = (base.x + 0.075 * Math.sin((autoTime * TAU) / 37 + phase * 2.1)) * aspect;
      centerData[i * 2 + 1] = base.y + 0.055 * Math.cos((autoTime * TAU) / 43 + phase * 1.3);
      radiusData[i] = base.r * (1 + 0.10 * Math.sin((autoTime * TAU) / 53 + phase));
    }

    let count = 0;
    for (const injection of injections) {
      if (count >= MAX_INJECTIONS) break;
      const u = clamp((nowSec - injection.t0) / INJECT_LIFE, 0, 1);
      const grow = 1 - (1 - Math.min(1, u / 0.22)) ** 3;
      injPosData[count * 2] = injection.x * aspect;
      injPosData[count * 2 + 1] = injection.y;
      injLabData.set(injection.lab, count * 3);
      injRadData[count] = 0.05 + 0.08 * grow;
      injWData[count] = 0.85 * smoothstep(0, 0.03, u) * (1 - smoothstep(0.10, 1, u));
      count++;
    }

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(program);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, autoTime);
    gl.uniform1f(uAspect, aspect);
    gl.uniform3fv(uPal, palData);
    gl.uniform2fv(uCenter, centerData);
    gl.uniform1fv(uRadius, radiusData);
    gl.uniform1i(uInjCount, count);
    gl.uniform2fv(uInjPos, injPosData);
    gl.uniform3fv(uInjLab, injLabData);
    gl.uniform1fv(uInjRad, injRadData);
    gl.uniform1fv(uInjWeight, injWData);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    dirty = false;
  }

  // ---------------------------------------------------------------------------
  // 7. Interaction (R5, R6) and reduced motion (R7)
  // ---------------------------------------------------------------------------

  let pressIndex = 0;
  let gestureColor = null;
  let lastDrop = { x: 0, y: 0, at: 0 };

  const toField = (event) => [
    event.clientX / window.innerWidth,
    1 - event.clientY / window.innerHeight,
  ];

  function inject(x, y, lab) {
    if (injections.length >= MAX_INJECTIONS) injections.shift();
    injections.push({ x: clamp(x, 0, 1), y: clamp(y, 0, 1), lab: lab.slice(), t0: performance.now() / 1000 });
    dirty = true;
  }

  canvas.addEventListener('pointerdown', (event) => {
    const [x, y] = toField(event);
    gestureColor = paletteLab[pressIndex % paletteLab.length];
    pressIndex += 1;
    inject(x, y, gestureColor);
    lastDrop = { x, y, at: performance.now() };
    canvas.setPointerCapture(event.pointerId);
  });

  canvas.addEventListener('pointermove', (event) => {
    if (!gestureColor || !canvas.hasPointerCapture(event.pointerId)) return;
    const [x, y] = toField(event);
    const now = performance.now();
    const moved = Math.hypot(x - lastDrop.x, y - lastDrop.y);
    if (moved > 0.045 || now - lastDrop.at > 160) {
      inject(x, y, gestureColor);
      lastDrop = { x, y, at: now };
    }
  });

  function endGesture(event) {
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    gestureColor = null;
  }
  canvas.addEventListener('pointerup', endGesture);
  canvas.addEventListener('pointercancel', endGesture);

  function refreshPalette() {
    fade.from = paletteLab.map((c) => c.slice());
    fade.to = createPalette().map(oklchToOklab);
    fade.start = performance.now();
    dirty = true;
  }

  function savePng() {
    draw(performance.now() / 1000);
    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `chromatic-field-${Date.now()}.png`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }, 'image/png');
  }

  window.addEventListener('keydown', (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.code === 'Space') {
      event.preventDefault();
      refreshPalette();
    } else if (event.key === 's' || event.key === 'S') {
      event.preventDefault();
      savePng();
    }
  });

  window.addEventListener('resize', resize);

  // ---------------------------------------------------------------------------
  // 8. Frame loop
  // ---------------------------------------------------------------------------

  let lastFrame = 0;

  function frame(now) {
    requestAnimationFrame(frame);

    const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0;
    lastFrame = now;

    if (!reduceMotion) {
      autoTime += dt;
      // Adaptive render scale keeps the 60 fps budget on slower GPUs.
      frameMs += ((dt || 1 / 60) * 1000 - frameMs) * 0.06;
      if (holdFrames > 0) holdFrames -= 1;
      else if (frameMs > 21 && renderScale > 0.65) {
        renderScale = Math.max(0.65, renderScale * 0.86);
        resize();
        holdFrames = 60;
      } else if (frameMs < 13.5 && renderScale < maxScale) {
        renderScale = Math.min(maxScale, renderScale * 1.08);
        resize();
        holdFrames = 120;
      }
    }

    const nowSec = now / 1000;
    updatePalette(now);

    let pruned = false;
    for (let i = injections.length - 1; i >= 0; i--) {
      if (nowSec - injections[i].t0 > INJECT_LIFE) {
        injections.splice(i, 1);
        pruned = true;
      }
    }
    if (pruned) dirty = true;

    // Under reduced motion nothing autonomous moves, so redraw only when an
    // input actually changes something (R7).
    if (reduceMotion && !dirty && fade.start < 0 && injections.length === 0) return;

    draw(nowSec);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
